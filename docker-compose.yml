services:
  postgres:
    image: postgres:16-alpine
    container_name: dream-exchange-postgres
    environment:
      POSTGRES_DB: dream_exchange
      POSTGRES_USER: dream_exchange
      POSTGRES_PASSWORD: dream_exchange
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dream_exchange -d dream_exchange"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dream-exchange-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
